name: roadmap
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  checks: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: ./.github/actions/land-on-main
        with:
          slug: roadmap
          commit-message: Sync ROADMAP.md from pilotless.nl/roadmap.md
          paths: ROADMAP.md
          git-name: github-actions[bot]
          git-email: 41898282+github-actions[bot]@users.noreply.github.com
          regenerate: curl -fsSL https://pilotless.nl/roadmap.md -o ROADMAP.md
