name: roadmap
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://pilotless.nl/roadmap.md -o ROADMAP.md
      - run: |
          git diff --quiet -- ROADMAP.md && git ls-files --error-unmatch ROADMAP.md >/dev/null 2>&1 && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ROADMAP.md && git commit -m "Sync ROADMAP.md from pilotless.nl/roadmap.md" && git push
