name: weekly status directory
on:
  schedule:
    - cron: '17 6 * * 4'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  checks: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: ./.github/actions/land-on-main
        with:
          slug: weekly-directory
          commit-message: 'docs: weekly refresh of the status directory'
          paths: docs
          git-name: pilotless-bot
          git-email: agent@pilotless.ai
          regenerate: python3 scripts/gen_status_directory.py && python3 scripts/gen_unowned.py && python3 scripts/gen_sitemap.py
      - name: Tell IndexNow the pages changed
        run: python3 scripts/ping_indexnow.py
